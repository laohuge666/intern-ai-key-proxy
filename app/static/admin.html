<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intern-AI Key Proxy · 管理后台</title>
<style>:root{
  --bg:#070b12; --panel:rgba(17,23,36,.78); --panel2:rgba(28,36,54,.85); --border:rgba(79,140,255,.16);
  --text:#dfe8f5; --muted:#7c8aa5; --accent:#38bdf8; --accent2:#22d3ee; --accent3:#818cf8;
  --warn:#fbbf24; --bad:#f87171;
  --grad:linear-gradient(120deg,#38bdf8 0%,#6366f1 55%,#a855f7 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#24324c;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden}
/* 背景：多层径向光晕 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 12% -5%,rgba(56,189,248,.14),transparent 60%),
    radial-gradient(ellipse 45% 45% at 92% 8%,rgba(129,140,248,.13),transparent 60%),
    radial-gradient(ellipse 70% 55% at 50% 115%,rgba(34,211,238,.07),transparent 60%)}
/* 背景：细网格（顶部渐隐） */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(79,140,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(79,140,255,.055) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 85% 80% at 50% 0%,#000 25%,transparent 85%);
  mask-image:radial-gradient(ellipse 85% 80% at 50% 0%,#000 25%,transparent 85%)}
.layout{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:220px;background:rgba(12,17,27,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh}
.logo{font-size:16px;font-weight:800;padding:6px 10px 18px;display:flex;align-items:center;gap:9px;letter-spacing:.4px}
.logo .txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent2);animation:pulse 2.4s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{background:none;border:0;color:var(--muted);text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center;transition:.18s;position:relative}
.menu button:hover{background:var(--panel2);color:var(--text)}
.menu button.active{background:linear-gradient(90deg,rgba(56,189,248,.16),rgba(99,102,241,.06));color:var(--accent);font-weight:600}
.menu button.active::before{content:"";position:absolute;left:0;top:20%;height:60%;width:2.5px;border-radius:99px;background:var(--grad);box-shadow:0 0 8px rgba(56,189,248,.8)}
.main{flex:1;padding:26px 32px;max-width:1100px;position:relative;z-index:1}
h1{font-size:21px;margin-bottom:4px;font-weight:700;letter-spacing:.2px}
.sub{color:var(--muted);margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:16px;transition:.2s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(120deg,rgba(56,189,248,.25),transparent 45%);opacity:0;transition:.25s}
.card:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.4);box-shadow:0 10px 30px -12px rgba(56,189,248,.35)}
.card:hover::after{opacity:.12}
.card .label{color:var(--muted);font-size:12px;margin-bottom:8px}
.card .value{font-size:24px;font-weight:700}
.card .value small{font-size:13px;color:var(--muted);font-weight:400}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.badge.online{background:rgba(34,197,94,.12);color:var(--accent2)}
.badge.degraded{background:rgba(239,68,68,.12);color:var(--bad)}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}
.panel h2{font-size:15px;margin-bottom:14px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.step.done .n{background:rgba(34,197,94,.15);color:var(--accent2);border-color:transparent;box-shadow:0 0 12px rgba(34,211,238,.25)}
.step .t{font-weight:600;margin-bottom:2px}
.step .d{color:var(--muted);font-size:13px}
code,.code{background:rgba(7,11,18,.85);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;overflow-x:auto;display:block;color:#a5e8ff;white-space:pre-wrap;word-break:break-all}
input{background:rgba(7,11,18,.7);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);width:100%;font-size:14px;outline:none;transition:.18s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
button.btn{background:var(--grad);border:0;color:#fff;padding:10px 20px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px -6px rgba(56,189,248,.6);transition:.18s}
button.btn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 6px 22px -6px rgba(56,189,248,.75)}
button.btn.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text);box-shadow:none}
button.btn.ghost:hover{border-color:rgba(56,189,248,.45);color:var(--accent);filter:none;box-shadow:0 4px 14px -8px rgba(56,189,248,.5)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tbody tr{transition:.15s}
tbody tr:hover{background:rgba(56,189,248,.05)}
tr:last-child td{border-bottom:0}
.pill{padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill.ready{background:rgba(34,197,94,.12);color:var(--accent2);box-shadow:0 0 10px -3px rgba(34,211,238,.5)}
.pill.cooling{background:rgba(245,158,11,.12);color:var(--warn)}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.login-wrap{max-width:400px;margin:9vh auto;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;padding:30px;position:relative;z-index:1;box-shadow:0 24px 70px -24px rgba(56,189,248,.4),0 0 0 1px rgba(56,189,248,.06) inset}
.login-wrap h2{font-size:18px;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-wrap .sub{margin-bottom:18px}
.login-wrap .field{margin-bottom:14px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.hero h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .spacer{flex:1}
button[id=logoutBtn]:hover{color:var(--accent) !important;background:rgba(56,189,248,.08) !important}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = '/admin/api';
let TOKEN = sessionStorage.getItem('tk') || '';
let VIEW = 'console';
let ST = null;   // status 缓存

const fmt = n => n>=1e6 ? (n/1e6).toFixed(2)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'K' : String(n||0);

async function req(path, opts={}){
  const headers = {'Content-Type':'application/json'};
  if(TOKEN) headers['Authorization']='Bearer '+TOKEN;
  const r = await fetch(API+path, {...opts, headers});
  const j = await r.json().catch(()=>({detail:'请求失败'}));
  if(r.status===401){
    // 会话失效（含容器重启后令牌清空）：自动退回登录页
    TOKEN=''; sessionStorage.removeItem('tk');
    ST = undefined;
    try{ await refresh(); }catch(e){}
    render();
    throw new Error('会话已过期，请重新登录');
  }
  if(!r.ok) throw new Error(j.detail || ('HTTP '+r.status));
  return j;
}

function render(){
  const app = document.getElementById('app');
  // 未获取过状态：显示加载中，避免误判为首次设置
  if(ST === null){
    app.innerHTML = '<div class="login-wrap"><div class="sub" style="text-align:center">加载中...</div></div>';
    return;
  }
  if(ST.needs_setup){ app.innerHTML = viewSetup(); bindMain(); return; }
  if(!TOKEN){ app.innerHTML = viewLogin(); bindMain(); return; }
  app.innerHTML = `
  <div class="layout">
    <div class="sidebar">
      <div class="logo"><span class="dot"></span><span class="txt">Intern-AI Proxy</span></div>
      <div class="menu" id="menu"></div>
      <div style="margin-top:auto;padding-top:14px;border-top:1px solid var(--border)">
        <button id="logoutBtn" style="background:none;border:0;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;width:100%;text-align:left">退出登录</button>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>`;
  buildMenu();
  buildMain();
  const lb = document.getElementById('logoutBtn');
  if(lb) lb.onclick = async ()=>{
    try{ await req('/logout',{method:'POST'}); }catch(e){}
    TOKEN=''; sessionStorage.removeItem('tk');
    // 先重新拉状态（此时是未登录态），再渲染，避免误判为首次设置
    ST = undefined;
    await refresh();
    render();
  };
}

function buildMenu(){
  const items = [['console','控制台'],['usage','用量'],['accounts','账号'],['keys','API 密钥'],['test','模型测试'],['settings','设置']];
  document.getElementById('menu').innerHTML = items.map(([k,l])=>
    `<button data-v="${k}" class="${VIEW===k?'active':''}">${l}</button>`).join('');
  document.querySelectorAll('#menu button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;buildMain();buildMenu();});
}

function buildMain(){
  const el = document.getElementById('main');
  const views = {console:viewConsole,usage:viewUsage,accounts:viewAccounts,keys:viewKeys,test:viewTest,settings:viewSettings};
  el.innerHTML = (views[VIEW]||viewConsole)();
  bindMain();
}

// ---------- 首次设置 ----------
function viewSetup(){
  return `<div class="login-wrap">
    <h2>设置管理员密码</h2>
    <div class="sub">首次使用，请设置管理后台的登录密码（至少 6 位）</div>
    <div class="field"><input id="pw1" type="password" placeholder="输入密码"></div>
    <div class="field"><input id="pw2" type="password" placeholder="再次确认"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="go">设置并登录</button>
  </div>`;
}
// ---------- 登录 ----------
function viewLogin(){
  return `<div class="login-wrap">
    <h2>登录管理后台</h2>
    <div class="sub">Intern-AI Key Proxy 网关管理</div>
    <div class="field"><input id="pw" type="password" placeholder="管理员密码"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="go">登录</button>
  </div>`;
}

// ---------- 控制台 ----------
function viewConsole(){
  const s = ST, st = s.stats;
  const steps = [
    {t:'添加上游账号', d:'已接入 '+s.total_accounts+' 个账号（Key 池轮询调度）', done:s.total_accounts>0},
    {t:'创建 API 密钥', d:'下游统一密钥：'+(s.api_keys?'已创建':'未创建')+'，见「API 密钥」页', done:s.api_keys>0},
    {t:'发送首个请求', d:'累计请求 '+fmt(st.total_requests)+' 次，今日 '+fmt(st.today_requests)+' 次', done:st.total_requests>0},
  ];
  return `
  <div class="hero">
    <div><h1>控制台</h1><div class="sub">几步内开始使用你的 API 网关</div></div>
    <div class="spacer"></div>
    <span class="badge ${s.gateway_status==='online'?'online':'degraded'}">网关${s.gateway_status==='online'?'在线':'降级'}</span>
  </div>
  <div class="cards">
    <div class="card"><div class="label">可用账号</div><div class="value">${s.ready_accounts}<small> / ${s.total_accounts} 个</small></div></div>
    <div class="card"><div class="label">API 密钥</div><div class="value">${s.api_keys}<small> 个</small></div></div>
    <div class="card"><div class="label">今日用量</div><div class="value">${fmt(st.today_tokens)}<small> tokens</small></div></div>
    <div class="card"><div class="label">累计用量</div><div class="value">${fmt(st.total_tokens)}<small> tokens</small></div></div>
    <div class="card"><div class="label">今日请求</div><div class="value">${fmt(st.today_requests)}</div></div>
    <div class="card"><div class="label">缓存命中</div><div class="value">${st.cache_hits}<small> 次，命中率 ${st.cache_hit_rate}%</small></div></div>
  </div>
  <div class="panel"><h2>开始使用</h2><div class="steps">
    ${steps.map(x=>`<div class="step ${x.done?'done':''}"><div class="n">${x.done?'✓':'·'}</div><div><div class="t">${x.t}</div><div class="d">${x.d}</div></div></div>`).join('')}
  </div></div>
  <div class="panel"><h2>首个 API 请求</h2>
    <div class="code">curl ${location.origin}/v1/chat/completions \\
  -H "Authorization: Bearer &lt;你的 API 密钥&gt;" \\
  -H "Content-Type: application/json" \\
  -d '{"model":"deepseek-v4-flash-0731","messages":[{"role":"user","content":"你好"}]}'</div>
    <div class="muted" style="margin-top:10px">密钥在「API 密钥」页查看；模型列表见「模型测试」。</div>
  </div>`;
}

function viewUsage(){
  const st = ST.stats;
  return `<h1>用量</h1><div class="sub">SQLite 持久化，容器重启后数据保留</div>
  <div class="cards">
    <div class="card"><div class="label">今日请求</div><div class="value">${fmt(st.today_requests)}</div></div>
    <div class="card"><div class="label">累计请求</div><div class="value">${fmt(st.total_requests)}</div></div>
    <div class="card"><div class="label">今日 tokens</div><div class="value">${fmt(st.today_tokens)}</div></div>
    <div class="card"><div class="label">累计 tokens</div><div class="value">${fmt(st.total_tokens)}</div></div>
    <div class="card"><div class="label">错误请求</div><div class="value">${st.errors}</div></div>
    <div class="card"><div class="label">运行时长</div><div class="value">${Math.floor(st.uptime/3600)}<small>h ${(Math.floor(st.uptime/60))%60}m</small></div></div>
  </div>
  <div class="panel"><h2>最近请求（最多 100 条）</h2>
    ${st.recent.length? `<table><tr><th>时间</th><th>模型</th><th>路径</th><th>tokens</th><th>状态</th></tr>
      ${st.recent.map(r=>`<tr><td class="mono">${r.time}</td><td class="mono">${r.model||'—'}</td><td class="mono">${r.path}</td><td>${r.tokens||'—'}</td><td>${r.status}</td></tr>`).join('')}</table>`
      : '<div class="muted">暂无请求记录</div>'}
  </div>`;
}

async function viewAccounts(){
  let accs=[]; let err='';
  try{ const j = await req('/accounts'); accs=j.accounts; }catch(e){ err=e.message; }
  if(err) return `<h1>账号</h1><div class="err">${err}</div>`;
  return `<h1>账号</h1><div class="sub">上游 API Key 池（脱敏显示，增删立即生效）</div>
  <div class="panel"><h2>共 ${accs.length} 个账号</h2>
    <table><tr><th>#</th><th>Key</th><th>状态</th><th>冷却剩余</th><th>调用数</th><th>错误数</th><th></th></tr>
    ${accs.map(a=>`<tr><td>${a.index}</td><td class="mono">${a.key}</td>
      <td><span class="pill ${a.status}">${a.status==='cooling'?'冷却中':'可用'}</span></td>
      <td>${a.status==='cooling'?a.cooldown_left+'s':'—'}</td><td>${a.used}</td><td>${a.errors}</td>
      <td><button class="btn ghost" style="padding:4px 12px;font-size:12px" data-del-acc="${a.index}">删除</button></td></tr>`).join('')}
    </table>
    <div style="display:flex;gap:10px;margin-top:16px;align-items:center">
      <input id="newAccKey" placeholder="粘贴新的上游 API Key（sk-...）" style="flex:1">
      <button class="btn" id="addAccBtn">添加账号</button>
    </div>
    <div class="err" id="accErr" style="margin-top:8px"></div>
  </div>`;
}

async function viewKeys(){
  let keys=[]; let err='';
  try{ const j = await req('/keys'); keys=j.keys; }catch(e){ err=e.message; }
  if(err) return `<h1>API 密钥</h1><div class="err">${err}</div>`;
  return `<h1>API 密钥</h1><div class="sub">下游调用本网关时使用的密钥（可创建多个，分别发给不同客户端）</div>
  <div class="panel"><h2>密钥列表（${keys.length}）</h2>
    <table><tr><th>标识</th><th>名称</th><th>密钥</th><th>创建时间</th><th></th></tr>
    ${keys.map(k=>{
      const plain = PLAIN_KEYS[k.id];
      const isNew = LAST_NEW_KEY && LAST_NEW_KEY.id===k.id;
      const shown = plain || k.key;
      return `<tr>
      <td class="mono">${k.id}</td><td>${k.name||'—'}</td>
      <td class="mono" style="${isNew?'color:var(--accent2)':''}">${shown}${plain?'':''}</td>
      <td>${k.created}</td>
      <td style="white-space:nowrap">
        ${plain ? `<button class="btn ghost" style="padding:4px 12px;font-size:12px" data-copy-key="${k.id}">复制完整密钥</button>`
                 : `<button class="btn ghost" style="padding:4px 12px;font-size:12px" data-reveal-key="${k.id}">显示明文</button>`}
        <button class="btn ghost" style="padding:4px 12px;font-size:12px" data-del-key="${k.id}">删除</button>
      </td></tr>`;
    }).join('')}
    </table>
    <div style="display:flex;gap:10px;margin-top:16px;align-items:center">
      <input id="newKeyName" placeholder="新密钥名称（如：手机/公司）" style="flex:1">
      <button class="btn" id="addKeyBtn">创建密钥</button>
    </div>
    <div class="err" id="keyErr" style="margin-top:8px"></div>
    <div id="newKeyOut" style="margin-top:10px"></div>
  </div>`;
}

// 明文只在内存中暂存，供页面内复制；刷新/切走即丢失
let PLAIN_KEYS = {};   // id -> 明文
let LAST_NEW_KEY = null; // {id, name, key} 最近创建的，用于醒目提示

function viewTest(){
  return `<h1>模型测试</h1><div class="sub">查询上游可用模型（走本网关 Key 池）</div>
  <div class="panel"><button class="btn" id="testBtn">测试连接</button>
    <div id="testOut" style="margin-top:14px"></div></div>`;
}

function viewSettings(){
  return `<h1>设置</h1><div class="sub">网关配置与管理员密码</div>
  <div class="panel"><h2>修改管理员密码</h2>
    <div class="field" style="margin-bottom:10px"><input id="oldPw" type="password" placeholder="原密码"></div>
    <div class="field" style="margin-bottom:10px"><input id="newPw" type="password" placeholder="新密码（至少 6 位）"></div>
    <div class="err" id="pwErr"></div>
    <button class="btn" id="pwBtn">保存</button></div>
  <div class="panel"><h2>当前配置</h2>
    <div class="muted" id="cfgOut">加载中...</div></div>`;
}

// ---------- 事件绑定 ----------
function bindMain(){
  const go = document.getElementById('go');
  if(go && !go.dataset.bound){
    go.dataset.bound = '1';
    go.onclick = async ()=>{
      const err = document.getElementById('err');
      if(err) err.textContent='';
      const pw1 = document.getElementById('pw1'), pw2 = document.getElementById('pw2'), pw = document.getElementById('pw');
      try{
        if(pw1){ // 首次设置密码
          if(pw1.value.length < 6){ if(err) err.textContent='密码至少 6 位'; return; }
          if(pw1.value!==pw2.value){ if(err) err.textContent='两次密码不一致'; return; }
          const j = await req('/setup',{method:'POST',body:JSON.stringify({password:pw1.value})});
          TOKEN=j.token; sessionStorage.setItem('tk',TOKEN);
        }else if(pw){ // 登录
          const j = await req('/login',{method:'POST',body:JSON.stringify({password:pw.value})});
          TOKEN=j.token; sessionStorage.setItem('tk',TOKEN);
        }
        await refresh(); render();
      }catch(e){ if(err) err.textContent=e.message; }
    };
  }
  const tb = document.getElementById('testBtn');
  if(tb && !tb.dataset.bound){
    tb.dataset.bound='1';
    tb.onclick = async ()=>{
      const out = document.getElementById('testOut');
      out.innerHTML='<span class="muted">测试中...</span>';
      try{
        const j = await req('/models');
        out.innerHTML = j.ok
          ? `<div class="muted" style="margin-bottom:8px">共 ${j.models.length} 个模型</div><div class="code">${j.models.join('\n')}</div>`
          : `<div class="err">${j.detail||'测试失败'}</div>`;
      }catch(e){ out.innerHTML=`<div class="err">${e.message}</div>`; }
    };
  }
  const pb = document.getElementById('pwBtn');
  if(pb && !pb.dataset.bound){
    pb.dataset.bound='1';
    pb.onclick = async ()=>{
      const e1=document.getElementById('pwErr'); e1.textContent='';
      try{
        await req('/password',{method:'POST',body:JSON.stringify({old_password:document.getElementById('oldPw').value,new_password:document.getElementById('newPw').value})});
        e1.style.color='var(--accent2)'; e1.textContent='密码已更新';
      }catch(e){ e1.textContent=e.message; }
    };
  }
  // 添加上游账号
  const addAcc = document.getElementById('addAccBtn');
  if(addAcc && !addAcc.dataset.bound){
    addAcc.dataset.bound='1';
    addAcc.onclick = async ()=>{
      const e1=document.getElementById('accErr'); e1.textContent='';
      const inp=document.getElementById('newAccKey');
      try{
        await req('/accounts',{method:'POST',body:JSON.stringify({key:inp.value})});
        await refresh(); buildMain();
      }catch(e){ e1.textContent=e.message; }
    };
  }
  // 删除上游账号
  document.querySelectorAll('[data-del-acc]').forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.onclick = async ()=>{
      if(!confirm('删除该上游账号？该 Key 将立即停止被调度。')) return;
      try{
        await req('/accounts/'+b.dataset.delAcc,{method:'DELETE'});
        await refresh(); buildMain();
      }catch(e){ alert(e.message); }
    };
  });
  // 创建下游密钥
  const addKey = document.getElementById('addKeyBtn');
  if(addKey && !addKey.dataset.bound){
    addKey.dataset.bound='1';
    addKey.onclick = async ()=>{
      const e1=document.getElementById('keyErr'); e1.textContent='';
      const inp=document.getElementById('newKeyName');
      try{
        const j = await req('/keys',{method:'POST',body:JSON.stringify({name:inp.value})});
        // 明文存内存：重建 DOM 后仍在，可反复复制；离开/刷新页面即丢失
        PLAIN_KEYS[j.id] = j.key;
        LAST_NEW_KEY = {id:j.id, name:j.name, key:j.key};
        inp.value='';
        await refresh(); buildMain();
        // 二次保险：重建后若提示被异步覆盖，再补一次
        const out2=document.getElementById('newKeyOut');
        if(out2) out2.innerHTML = `<div class="code" style="color:var(--accent2)">密钥已创建，明文已在下方列表中，可点击「复制完整密钥」：<br>${j.key}</div>`;
      }catch(e){ if(e1) e1.textContent=e.message; }
    };
  }
  // 复制完整密钥（页面内存中的明文）
  document.querySelectorAll('[data-copy-key]').forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.onclick = async ()=>{
      const id = b.dataset.copyKey;
      const val = PLAIN_KEYS[id];
      if(!val){ buildMain(); return; }
      try{
        await navigator.clipboard.writeText(val);
        b.textContent='已复制 ✓'; setTimeout(()=>{ if(b.isConnected) b.textContent='复制完整密钥'; },1500);
      }catch(_){
        // 非安全上下文（http）降级：选中文本
        const ta=document.createElement('textarea'); ta.value=val;
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); b.textContent='已复制 ✓'; setTimeout(()=>{ if(b.isConnected) b.textContent='复制完整密钥'; },1500); }catch(e2){ alert('复制失败，请手动选择文本：\n'+val); }
        ta.remove();
      }
    };
  });
  // 显示明文（从后端取一次，存入内存）
  document.querySelectorAll('[data-reveal-key]').forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.onclick = async ()=>{
      const id = b.dataset.revealKey;
      try{
        const j = await req('/keys/'+id+'?plain=1');
        PLAIN_KEYS[id] = j.key;
        buildMain();
      }catch(e){ alert(e.message); }
    };
  });
  // 删除下游密钥
  document.querySelectorAll('[data-del-key]').forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.onclick = async ()=>{
      if(!confirm('删除该密钥？使用该密钥的客户端将立即无法调用。')) return;
      try{
        await req('/keys/'+b.dataset.delKey,{method:'DELETE'});
        await refresh(); buildMain();
      }catch(e){ alert(e.message); }
    };
  });
  const cfg = document.getElementById('cfgOut');
  if(cfg) req('/settings').then(j=>{    cfg.innerHTML = `<table><tr><th>上游基址</th><td class="mono">${j.upstream_base_url}</td></tr>
      <tr><th>Key 数量</th><td>${j.total_keys}</td></tr>
      <tr><th>冷却秒数</th><td>${j.key_cooldown_seconds}s</td></tr>
      <tr><th>请求超时</th><td>${j.request_timeout_seconds}s</td></tr>
      <tr><th>强制鉴权</th><td>${j.require_auth?'是':'否'}</td></tr></table>`;
  }).catch(e=>{cfg.textContent='加载失败：'+e.message;});
}

async function refresh(){
  // status 接口无需登录，直接 fetch，不触发 401 跳转逻辑
  try{
    const r = await fetch(API+'/status');
    ST = await r.json();
  }catch(e){ ST = ST || undefined; }
}

// 异步视图（accounts/keys 需要请求数据）
const _origBuild = buildMain;
buildMain = async function(){
  const views = {accounts:viewAccounts, keys:viewKeys};
  const v = views[VIEW];
  if(v && typeof v==='function'){
    const main = document.getElementById('main');
    if(!main) return;
    main.innerHTML='<div class="muted">加载中...</div>';
    try {
      const html = await v();
      if(main) main.innerHTML = html;
    } catch (e) {
      if(main) main.innerHTML = '<div class="err">加载失败：'+e.message+'</div>';
    }
    bindMain();
    return;
  }
  _origBuild();
};

(async()=>{ await refresh(); render(); })();
setInterval(async()=>{ if(TOKEN && ST && !ST.needs_setup){ await refresh(); if(VIEW==='console'||VIEW==='usage') buildMain(); } }, 15000);
</script>
</body>
